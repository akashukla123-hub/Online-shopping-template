<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index Sign In</title>
    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <!-- Header -->
    <div class="navbar">
        <div class="logo"><a href="index.html">Shop<span>Little</span></a></div>
    </div>

    <!-- Sign In Form -->
    <div class="signin-container">
        <div class="signin-box">
            <h1>Sign in</h1>
            <form id="signinForm">
                <div class="form-group">
                    <label for="email">Email or mobile phone number</label>
                    <input type="text" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="signin-btn">Sign in</button>

                <div class="help-text">
                    By continuing, you agree to index's
                    <a href="#">Conditions of Use</a> and
                    <a href="#">Privacy Notice</a>.
                </div>

                <div class="help-text">
                    <a href="#">Need help?</a>
                </div>
            </form>
        </div>

        <div class="divider">
            <span>New to index?</span>
        </div>

        <a href="signup.html"><button class="create-account-btn">Create your index account</button></a>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p>&copy; 2026 index - For Educational Purpose Only</p>
    </div>

    <script>
        // Login logic
        document.getElementById('signinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('index_users')) || [];
            const user = users.find(u => u.mobile === email && u.password === password);
            
            if (user) {
                alert('Welcome back, ' + user.name + '!');
                localStorage.setItem('index_logged_in', user.name);
                window.location.href = 'index.html';
            } else {
                alert('Incorrect email or password. Please try again or create an account.');
            }
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
