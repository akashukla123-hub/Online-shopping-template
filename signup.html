<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ShopLittle</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <!-- Logo -->
    <div class="logo-header">
        <a href="shoplittle.html">Shop<span>Little</span></a>
    </div>

    <!-- Signup Form -->
    <div class="signup-container">
        <div class="signup-box">
            <h1>Create account</h1>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" placeholder="First and last name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile number or email</label>
                    <input type="text" id="mobile" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="repassword">Re-enter password</label>
                    <input type="password" id="repassword" required>
                </div>

                <button type="submit" class="continue-btn">Create your ShopLittle account</button>
            </form>

            <div class="terms">
                By creating an account, you agree to ShopLittle's 
                <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
            </div>

            <div class="divider"><span>Already have an account?</span></div>

            <div class="signin-link">
                <a href="signin.html">Sign in →</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p>&copy; 2026, ShopLittle.com, Inc. or its affiliates</p>
    </div>

    <script>
        // Basic form validation
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const repassword = document.getElementById('repassword').value;

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            if (password !== repassword) {
                alert('Passwords do not match');
                return;
            }

            // Save user to localStorage
            const users = JSON.parse(localStorage.getItem('shoplittle_users')) || [];
            users.push({ name, mobile, password });
            localStorage.setItem('shoplittle_users', JSON.stringify(users));
            
            alert('Account created successfully!');
            window.location.href = 'signin.html';
        });
    </script>

</body>
</html>
